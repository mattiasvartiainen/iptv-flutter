<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanal: IPTV TV experience concept</title>
<style>
:root{--bg:#0c1018;--s1:#161c28;--s2:#222b3b;--tx:#eef1f7;--mu:#93a0b8;--ac:#9db4ff;--wm:#ffb86b;--ok:#6fd6a0;--on:#0c1018;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f7;--s1:#fff;--s2:#dfe5f1;--tx:#131824;--mu:#54607a;--ac:#3453d1;--wm:#b85f00;--ok:#16874f;--on:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef1f7;--s1:#fff;--s2:#dfe5f1;--tx:#131824;--mu:#54607a;--ac:#3453d1;--wm:#b85f00;--ok:#16874f;--on:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header,main{max-width:1280px;margin:0 auto;padding:20px 16px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
p.lead{margin:0 0 16px;color:var(--mu);max-width:70ch}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
nav.tabs button,.tg{font:inherit;border:0;border-radius:99px;padding:8px 16px;background:var(--s1);color:var(--mu);cursor:pointer}
nav.tabs button[aria-pressed=true]{background:var(--ac);color:var(--on);font-weight:600}
.wrap{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:var(--bg);border:1px solid var(--s2);position:relative}
#stage{width:1280px;height:720px;transform-origin:0 0;position:absolute;left:0;top:0;background:radial-gradient(1100px 500px at 75% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent),var(--bg)}
.note{margin:12px 0;color:var(--mu);max-width:80ch}.note b{color:var(--tx)}
.f{outline:0;transition:transform .15s,box-shadow .15s}
.f:focus{outline:4px solid var(--tx);outline-offset:3px;transform:scale(1.06);position:relative;z-index:3;box-shadow:0 14px 34px #0009}
.sel{box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--ac) 35%,transparent)}
.top{display:flex;gap:10px;align-items:center;padding:26px 56px 14px}
.logo{font-size:26px;font-weight:700;margin-right:24px;letter-spacing:-.03em}.logo em{color:var(--wm);font-style:normal}
.pill{padding:9px 22px;border-radius:99px;font-size:20px;color:var(--mu)}
.pill.cur{background:var(--s2);color:var(--tx);font-weight:600}
.pad{padding:28px 56px 0 136px}.rail{position:absolute;left:0;top:0;bottom:0;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 0;background:color-mix(in srgb,var(--s1) 75%,transparent)}.rail .lg{font-size:30px;font-weight:700;margin-bottom:14px}.rail .it{width:76px;padding:10px 0 6px;border-radius:14px;text-align:center;font-size:14px;color:var(--mu)}.rail .it svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;display:block;margin:0 auto 2px}.rail .it.cur{background:var(--s2);color:var(--tx)}.rail .it.cur svg{stroke:var(--ac)}.gi{display:flex;justify-content:space-between;padding:12px 14px;border-radius:10px;font-size:20px;color:var(--mu);margin-bottom:4px}.gi small{font-size:16px}.gi.cur{color:var(--tx);background:var(--s2);box-shadow:inset 4px 0 var(--ac)}.tab{display:inline-block;padding:8px 24px;font-size:21px;color:var(--mu);margin-bottom:-3px}.tab.cur{color:var(--tx);font-weight:600;box-shadow:0 3px var(--ac)}.ch{display:flex;gap:12px;align-items:center;padding:8px 14px;border-radius:10px;background:var(--s1);margin-bottom:6px;font-size:19px;position:relative;overflow:hidden}.ch>b{width:26px;color:var(--mu);font-weight:500}.ch.cur{background:var(--s2);box-shadow:inset 4px 0 var(--ac)}.ch .n span{color:var(--mu);font-size:17px}.ch i{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}.ch .lg2{width:44px;height:34px;border-radius:7px;background:hsl(var(--h) 50% 36%);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.h{font-size:24px;font-weight:600;margin:0 0 12px}
.sub{font-size:18px;color:var(--mu);margin:0 0 8px}
.row{display:flex;gap:16px}
.card{width:160px;height:96px;border-radius:12px;padding:10px;position:relative;overflow:hidden;display:flex;align-items:flex-end;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 55% 40%),hsl(calc(var(--h) + 40) 50% 18%))}
.card small{display:block;font-size:15px;font-weight:400;opacity:.85}
.card.p{width:138px;height:200px}.card.s{width:130px;height:56px;padding:8px}.card.w{width:230px;height:130px}
.card i{position:absolute;left:0;bottom:0;height:5px;background:var(--ac)}
.live{position:absolute;top:8px;right:8px;background:var(--wm);color:#000;font-size:13px;font-weight:700;padding:1px 7px;border-radius:5px}
.band{background:var(--s1);border-radius:14px;padding:16px 20px;display:flex;gap:16px;align-items:center}
.btn{display:inline-block;padding:12px 28px;border-radius:10px;font-size:20px;font-weight:600;background:var(--s2);color:var(--tx);margin-right:12px}
.btn.pr{background:var(--ac);color:var(--on)}
.chip{display:inline-block;padding:7px 18px;border-radius:99px;background:var(--s2);font-size:19px;margin:0 8px 8px 0}
.chip.cur{background:var(--ac);color:var(--on);font-weight:600}
.epg{position:relative;height:52px;margin-bottom:6px}
.epg .c{position:absolute;left:0;width:132px;height:50px;background:var(--s1);border-radius:8px;padding:12px;font-size:18px;font-weight:600}
.epg .pg{position:absolute;height:50px;border-radius:8px;background:var(--s2);padding:5px 10px;font-size:17px;overflow:hidden;white-space:nowrap}
.epg .pg.now{background:color-mix(in srgb,var(--ac) 30%,var(--s2))}
.ep{display:flex;gap:16px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--s1);margin-bottom:8px;font-size:20px;position:relative;overflow:hidden}
.ep .t{width:96px;height:54px;border-radius:8px;background:linear-gradient(140deg,hsl(var(--h) 50% 38%),hsl(calc(var(--h) + 40) 45% 18%))}
.ep .st{margin-left:auto;font-size:17px;color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--wm)}
.doc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.doc section{background:var(--s1);border-radius:14px;padding:16px 20px}.doc h3{margin:0 0 8px;font-size:18px}
.doc ul{margin:0;padding-left:18px;color:var(--mu)}.doc li b{color:var(--tx)}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.sw span{padding:8px 10px;border-radius:8px;font-size:13px;color:var(--tx);background:var(--s2)}
.phones{display:flex;gap:20px;flex-wrap:wrap}
.ph{width:290px;height:600px;border-radius:30px;border:6px solid var(--s2);background:var(--bg);overflow:hidden;position:relative;padding:16px 14px}
.ph .h{font-size:19px}.ph .card{width:100%;height:76px;margin-bottom:8px}.ph .seg{display:flex;gap:6px;margin-bottom:12px}
.ph .seg span{flex:1;text-align:center;padding:6px;border-radius:99px;background:var(--s1);font-size:14px}.ph .seg .cur{background:var(--ac);color:var(--on);font-weight:600}
.ph .tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:12px 0 18px;background:var(--s1);font-size:13px;color:var(--mu)}
.ph .tabbar .cur{color:var(--ac);font-weight:700}
.ph .row2{display:flex;gap:10px;align-items:center;background:var(--s1);border-radius:12px;padding:10px;margin-bottom:8px;font-size:14px}
.ph .row2 .t{width:44px;height:44px;border-radius:10px;background:var(--s2);flex:none}
.ph .sb{display:flex;gap:8px;align-items:center;margin-bottom:12px}.ph .sb span{flex:1;background:var(--s1);border-radius:99px;padding:8px 14px;color:var(--mu);font-size:13px}.ph .sb b{width:30px;height:30px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:13px}.ph .mp{position:absolute;left:8px;right:8px;bottom:62px;background:var(--s2);border-radius:12px;padding:8px;display:flex;gap:10px;align-items:center;font-size:12px;box-shadow:0 6px 18px #0006}.ph .mp .v{width:64px;height:38px;border-radius:7px;background:linear-gradient(160deg,#1c4a31,#0c1018);flex:none;position:relative;overflow:hidden}.ph .mp .v i{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}.ph .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph .g3 .card{height:112px;margin:0;font-size:12px;padding:6px}.ph .card small{font-size:11px}.ph .btn{display:block;text-align:center;padding:9px;font-size:15px;margin:0 0 12px}[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.f{transition:none}}
</style></head><body>
<header><h1>Kanal, a personal TV gateway</h1>
<p class="lead">UX concept for the IPTV app on LG webOS, Android, Windows and Linux. Open a screen, then use the arrow keys and Enter on the TV views: the ring shows focus, the tint shows selection.</p>
<nav class="tabs" id="tabs"></nav></header>
<main>
<div id="ov" class="doc"></div>
<div id="fl" class="doc" hidden></div>
<div id="tv" class="wrap" hidden><div id="stage"></div></div>
<div id="ph" class="phones" hidden></div>
<div class="note" id="note"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const C=(h,t,s,p,x='')=>`<div class="card f ${x}" tabindex="0" data-t="${t}" data-s="${s||''}" data-h="${h}" style="--h:${h}">${p===-1?'<span class="live">LIVE</span>':''}<span>${t}${s?`<small>${s}</small>`:''}</span>${p>0?`<i style="width:${p}%"></i>`:''}</div>`;
const IC={Home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',Live:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/>',Movies:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/>',Series:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 3h10M10 11l5 3-5 3z"/>',Search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',Settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const nav=a=>`<div class="rail"><span class="lg">k<em style="color:var(--wm);font-style:normal">.</em></span>${[['Home','Home'],['Live TV','Live'],['Movies','Movies'],['Series','Series'],['Search','Search'],['Settings','Settings']].map(([n,k])=>`<span class="it f${n==a?' cur':''}" tabindex="0"><svg viewBox="0 0 24 24">${IC[k]}</svg>${k}</span>`).join('')}</div>`;
const DESC={Harbour:'Two ferry crews and one night of fog. S2:E4, 22 minutes left.',SVT1:'Live now: Rapport.','Sport 2':'GAIS vs Hammarby kicks off at 19:00.','Northern Lights':'A ferry pilot finds a message meant for someone else. 42 minutes left.',Midnatt:'Rated 8.1. New to your library.',Isfåglar:'A thriller rated 7.9 from the Thrillers group.',Hemma:'A quiet drama rated 8.4.',Kustvakt:'A new season of the coast guard crime series.',Fjordlight:'Similar in mood to Harbour.',Nordvik:'Season 1, episode 1 started. Pick up where you left off.'};
const S={};
let sp=0;
S.home=()=>nav('Home')+`<div class="pad"><div id="hero" style="height:164px;border-radius:16px;padding:20px 28px;margin-bottom:18px;background:linear-gradient(120deg,hsl(330 50% 30%),transparent 85%),var(--s1)"><div id="hT" style="font-size:42px;font-weight:700;letter-spacing:-.02em">Harbour</div><div id="hM" style="font-size:20px;color:var(--mu);margin:2px 0 8px">S2:E4, next up</div><div id="hD" style="font-size:21px;max-width:60ch">${DESC.Harbour}</div></div>
<h2 class="h">Recently watched</h2><div class="row" style="gap:24px">
<div><p class="sub">Live TV</p><div class="row">${C(200,'SVT1','Rapport',-1)}${C(20,'Sport 2','On now',-1)}</div></div>
<div><p class="sub">Movies</p><div class="row">${C(260,'Northern Lights','42 min left',55)}${C(150,'Salt Road','Start',0)}</div></div>
<div><p class="sub">Series</p><div class="row">${C(330,'Harbour','S2:E4, next up',62,'af')}${C(40,'Nordvik','S1:E1',20)}</div></div></div>
${sp==2?'':`<div class="band" style="margin-top:20px;padding:12px 20px"><div style="flex:1"><b style="font-size:26px">${sp?'GAIS, probably today 19:00':'GAIS vs Hammarby, today 19:00'}</b><div style="color:var(--mu);font-size:18px">${sp?'Matched from the guide on Sport 2. Details unconfirmed.':'Sport 2, starts in 1 h 20 min. Next: Frölunda, tomorrow 17:00.'}</div></div><span class="btn pr f" tabindex="0" style="margin:0">${sp?'Open Sport 2':'Watch on Sport 2'}</span></div>`}
<h2 class="h" style="margin-top:20px">Tonight, picked for you</h2><div class="row">${C(30,'Midnatt','8.1, new here')}${C(200,'Isfåglar','7.9, thriller')}${C(150,'Hemma','8.4, drama')}${C(330,'Kustvakt','New season')}${C(260,'Fjordlight','Like Harbour')}</div></div>`;
const R=[['SVT1',[[0,45,'Rapport',1],[45,75,'Vem bor här?'],[120,60,'Skavlan']]],['SVT2',[[0,30,'Aktuellt',1],[30,90,'Dokumentären'],[120,60,'Nyheter']]],['TV4',[[0,60,'Nyhetsmorgon',1],[60,60,'Idol'],[120,60,'Efter tio']]],['Sport 1',[[0,40,'Studio',1],[40,110,'Frölunda, tomorrow preview'],[150,30,'Mål']]],['Sport 2',[[0,25,'Warm-up',1],[25,125,'GAIS, kick-off 19:00'],[150,30,'Studio']]],['Kanal 5',[[0,55,'Ink Masters',1],[55,65,'Law & Order'],[120,60,'Late night']]]];
S.guide=nav('Live TV')+`<div class="pad" style="display:flex;gap:24px"><div style="width:200px"><p class="sub">Groups</p>${['Favorites','All channels','Sport','News','Nordic','Kids'].map(g=>`<div class="chip f${g=='Sport'?' cur':''}" tabindex="0" style="display:block;border-radius:10px;margin-bottom:8px">${g}</div>`).join('')}</div>
<div style="flex:1"><div class="band" style="margin-bottom:14px;padding:12px 18px"><div style="flex:1"><b style="font-size:24px">GAIS, kick-off 19:00</b><div style="color:var(--mu);font-size:18px">Sport 2, 19:00 to 21:00. Press OK to watch now.</div></div></div>
<div class="epg" style="height:30px"><div style="position:absolute;left:144px;right:0;display:flex;justify-content:space-between;font-size:17px;color:var(--mu)">${['18:30','19:00','19:30','20:00','20:30','21:00'].map(t=>`<span>${t}</span>`).join('')}</div></div>
${R.map(([n,ps])=>`<div class="epg"><div class="c">${n}</div>${ps.map(([s,l,t,w])=>`<div class="pg f${w?' now':''}" tabindex="0" style="left:${144+s*3.9}px;width:${l*3.9-4}px">${t}</div>`).join('')}</div>`).join('')}</div></div>`;
const CH=[['1','SVT1','Rapport',70,200],['2','SVT2','Aktuellt',40,120],['3','TV3','Vem bor här?',20,60],['4','TV4','Efter tio',55,350],['5','Sport 1','Studio, then Frölunda',30,20],['6','Sport 2','GAIS vs Hammarby',10,280],['7','Kanal 5','Ink Masters',80,10]];
S.live=nav('Live TV')+`<div class="pad" style="display:flex;gap:24px"><div style="width:180px"><p class="sub">Groups</p>${[['Favorites',6],['Sweden',213],['Sport',41],['News',12],['Kids',29],['Nordic',78]].map(([g,n],i)=>`<div class="f gi${i==2?' cur':''}" tabindex="0"><span>${g}</span><small>${n}</small></div>`).join('')}</div>
<div style="flex:1;min-width:0"><p class="sub">Sport, now playing</p>${CH.map(([n,c,pg,pr,h],i)=>`<div class="f ch${i==5?' cur':''}" tabindex="0"><b>${n}</b><span class="lg2" style="--h:${h}">${c[0]}</span><span class="n" style="flex:1;min-width:0"><b>${c}</b> <small style="color:var(--mu)">HD</small><br><span>${pg}</span></span><i style="width:${pr}%"></i></div>`).join('')}</div>
<div style="width:380px"><div style="height:214px;border-radius:14px;background:linear-gradient(160deg,#1c4a31,#0c1018);position:relative"><span class="live">LIVE</span></div><div style="font-size:30px;font-weight:700;margin:10px 0 4px">Sport 2</div>${[['19:00','GAIS vs Hammarby',1],['21:00','Studio'],['21:30','Highlights'],['22:00','Frölunda replay']].map(([t,pg,n])=>`<div style="font-size:19px;padding:2px 0;color:${n?'var(--wm)':'var(--tx)'}"><span style="display:inline-block;width:70px">${t}</span>${pg}</div>`).join('')}<div style="margin-top:12px"><span class="btn pr f" tabindex="0" style="padding:10px 18px;margin-right:8px">Watch</span><span class="btn f" tabindex="0" style="padding:10px 18px;margin-right:8px">Full guide</span><span class="btn f" tabindex="0" style="padding:10px 18px">Favorite</span></div></div></div>`;
S.movie=nav('Movies')+`<div class="pad" style="display:flex;gap:44px;margin-top:10px"><div class="card p f" tabindex="0" style="--h:260;width:250px;height:370px;font-size:26px">Northern Lights</div><div style="flex:1">
<div style="font-size:54px;font-weight:700;letter-spacing:-.03em;line-height:1.05">Northern Lights</div><div style="font-size:22px;color:var(--mu);margin:10px 0">2024, 1 h 52 min, rated 7.8, Thriller and Drama, new to your library</div>
<p style="font-size:22px;max-width:46ch;margin:0 0 22px">A ferry pilot in Luleå finds a message meant for someone else, and the night gets longer.</p>
<span class="btn pr f" tabindex="0">Resume at 1:02:14</span><span class="btn f" tabindex="0">Start from beginning</span><span class="btn f" tabindex="0">Favorite</span>
<p class="sub" style="margin-top:34px">Similar to this</p><div class="row">${C(150,'Salt Road','',0,'p')}${C(30,'Blåsvart','',0,'p')}${C(200,'Isfåglar','',0,'p')}${C(330,'Hemma','',0,'p')}</div></div></div>`;
S.series=nav('Series')+`<div class="pad"><div style="display:flex;gap:28px"><div class="card p f" tabindex="0" style="--h:330;width:170px;height:255px;flex:none;font-size:24px">Harbour<i style="width:62%"></i></div><div><div style="font-size:46px;font-weight:700;letter-spacing:-.02em">Harbour</div><div style="font-size:20px;color:var(--mu);margin:2px 0 8px">2024, 3 seasons, rated 8.2, Drama and Mystery</div><div style="font-size:21px;max-width:56ch;margin-bottom:18px">Two ferry crews and one night of fog. You are on S2:E4, 22 minutes left.</div><span class="btn pr f" tabindex="0">Resume S2:E4</span><span class="btn f" tabindex="0">Start over</span><span class="btn f" tabindex="0">Favorite</span></div></div>
<div style="margin:20px 0 14px;border-bottom:3px solid var(--s2)">${['Season 1','Season 2','Season 3'].map(x=>`<span class="tab f${x=='Season 2'?' cur':''}" tabindex="0">${x}</span>`).join('')}</div>
